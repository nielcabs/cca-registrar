<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="Segoe UI, Arial, sans-serif">
  <title>Use case - CCA Registrar by user role</title>
  <text x="550" y="30" text-anchor="middle" font-size="15" font-weight="700">CCA Registrar Office - use cases by user role</text>
  <text x="550" y="50" text-anchor="middle" font-size="11">Roles: student | registrar | department (Library, Finance, MISSO, SASO, Guidance, Extension)</text>

  <rect x="40" y="65" width="1020" height="670" fill="none" stroke="#000" stroke-width="2"/>

  <!-- Swimlanes -->
  <line x1="40" y1="265" x2="1060" y2="265" stroke="#ccc" stroke-width="1"/>
  <line x1="40" y1="465" x2="1060" y2="465" stroke="#ccc" stroke-width="1"/>

  <!-- ========== ROW 1: STUDENT ========== -->
  <circle cx="115" cy="145" r="13" fill="none" stroke="#000" stroke-width="2"/>
  <line x1="115" y1="158" x2="115" y2="198" stroke="#000" stroke-width="2"/>
  <line x1="115" y1="172" x2="94" y2="190" stroke="#000" stroke-width="2"/>
  <line x1="115" y1="172" x2="136" y2="190" stroke="#000" stroke-width="2"/>
  <line x1="115" y1="198" x2="96" y2="228" stroke="#000" stroke-width="2"/>
  <line x1="115" y1="198" x2="134" y2="228" stroke="#000" stroke-width="2"/>
  <text x="115" y="248" text-anchor="middle" font-size="11" font-weight="600">Student</text>

  <text x="550" y="88" text-anchor="middle" font-size="10" font-weight="700">Student role</text>
  <ellipse cx="340" cy="130" rx="115" ry="19" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="340" y="134" text-anchor="middle" font-size="9.5">Use student portal</text>
  <line x1="132" y1="175" x2="225" y2="130" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>

  <g font-size="8.5">
    <ellipse cx="340" cy="165" rx="115" ry="16" fill="#fff" stroke="#000" stroke-width="1.2"/>
    <text x="340" y="168" text-anchor="middle">Register / log in / change password</text>
    <ellipse cx="340" cy="195" rx="115" ry="16" fill="#fff" stroke="#000" stroke-width="1.2"/>
    <text x="340" y="198" text-anchor="middle">Submit document request</text>
    <ellipse cx="340" cy="225" rx="115" ry="16" fill="#fff" stroke="#000" stroke-width="1.2"/>
    <text x="340" y="228" text-anchor="middle">Track request / view clearance</text>
  </g>
  <!-- Stacked ovals share cx: vertical connectors on centerline (not sideways stubs) -->
  <g stroke="#000" fill="none" stroke-width="1.5" stroke-linecap="round">
    <line x1="340" y1="149" x2="340" y2="165"/>
    <line x1="340" y1="181" x2="340" y2="195"/>
    <line x1="340" y1="211" x2="340" y2="225"/>
  </g>

  <!-- ========== ROW 2: REGISTRAR ========== -->
  <circle cx="115" cy="365" r="13" fill="none" stroke="#000" stroke-width="2"/>
  <line x1="115" y1="378" x2="115" y2="418" stroke="#000" stroke-width="2"/>
  <line x1="115" y1="392" x2="94" y2="410" stroke="#000" stroke-width="2"/>
  <line x1="115" y1="392" x2="136" y2="410" stroke="#000" stroke-width="2"/>
  <line x1="115" y1="418" x2="96" y2="448" stroke="#000" stroke-width="2"/>
  <line x1="115" y1="418" x2="134" y2="448" stroke="#000" stroke-width="2"/>
  <text x="115" y="472" text-anchor="middle" font-size="10" font-weight="600">Registrar staff</text>

  <text x="550" y="298" text-anchor="middle" font-size="10" font-weight="700">Registrar role</text>
  <ellipse cx="550" cy="330" rx="130" ry="19" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="550" y="334" text-anchor="middle" font-size="9.5">Use registrar workspace</text>
  <line x1="132" y1="395" x2="420" y2="330" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>

  <g font-size="8.5">
    <ellipse cx="550" cy="365" rx="130" ry="16" fill="#fff" stroke="#000" stroke-width="1.2"/>
    <text x="550" y="368" text-anchor="middle">Manage user accounts</text>
    <ellipse cx="550" cy="395" rx="130" ry="16" fill="#fff" stroke="#000" stroke-width="1.2"/>
    <text x="550" y="398" text-anchor="middle">Process queue / OCR / schedule release</text>
    <ellipse cx="550" cy="425" rx="130" ry="16" fill="#fff" stroke="#000" stroke-width="1.2"/>
    <text x="550" y="428" text-anchor="middle">Student clearances / reports / PDF / audit</text>
  </g>
  <g stroke="#000" fill="none" stroke-width="1.5" stroke-linecap="round">
    <line x1="550" y1="349" x2="550" y2="365"/>
    <line x1="550" y1="381" x2="550" y2="395"/>
    <line x1="550" y1="411" x2="550" y2="425"/>
  </g>

  <!-- ========== ROW 3: DEPARTMENT OFFICER ========== -->
  <circle cx="115" cy="585" r="13" fill="none" stroke="#000" stroke-width="2"/>
  <line x1="115" y1="598" x2="115" y2="638" stroke="#000" stroke-width="2"/>
  <line x1="115" y1="612" x2="94" y2="630" stroke="#000" stroke-width="2"/>
  <line x1="115" y1="612" x2="136" y2="630" stroke="#000" stroke-width="2"/>
  <line x1="115" y1="638" x2="96" y2="668" stroke="#000" stroke-width="2"/>
  <line x1="115" y1="638" x2="134" y2="668" stroke="#000" stroke-width="2"/>
  <text x="115" y="692" text-anchor="middle" font-size="9" font-weight="600">Department officer</text>

  <text x="550" y="498" text-anchor="middle" font-size="10" font-weight="700">Department officer role</text>
  <ellipse cx="340" cy="530" rx="115" ry="19" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="340" y="534" text-anchor="middle" font-size="9.5">Use department portal</text>
  <line x1="132" y1="615" x2="225" y2="530" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>

  <g font-size="8.5">
    <ellipse cx="340" cy="565" rx="115" ry="16" fill="#fff" stroke="#000" stroke-width="1.2"/>
    <text x="340" y="568" text-anchor="middle">Log in / change password</text>
    <ellipse cx="340" cy="595" rx="115" ry="16" fill="#fff" stroke="#000" stroke-width="1.2"/>
    <text x="340" y="598" text-anchor="middle">Search students (own office)</text>
    <ellipse cx="340" cy="625" rx="115" ry="16" fill="#fff" stroke="#000" stroke-width="1.2"/>
    <text x="340" y="628" text-anchor="middle">Update clearance (own office)</text>
  </g>
  <g stroke="#000" fill="none" stroke-width="1.5" stroke-linecap="round">
    <line x1="340" y1="549" x2="340" y2="565"/>
    <line x1="340" y1="581" x2="340" y2="595"/>
    <line x1="340" y1="611" x2="340" y2="625"/>
  </g>
</svg>
